name: Burning-surrogate training image

# Builds tools/burn/Dockerfile and pushes it to ghcr.io/<owner>/shaderous-burn, tagged
# latest and with the commit, for training on GPU pods (Runpod).
on:
  push:
    branches: [main]
    paths:
      - "tools/burn/**"
      - ".github/workflows/burn-image.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: burn-image
  cancel-in-progress: true

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      # The base image is about 25 GB unpacked; the runner starts with about 14 GB free.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune --all --force
          df -h /
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: tools/burn
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/shaderous-burn:latest
            ghcr.io/${{ github.repository_owner }}/shaderous-burn:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=Training image for the Shaderous burning surrogate (tools/burn)
