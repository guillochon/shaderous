name: Release

# Push a tag vX.Y.Z to release: the npm package (the built page with the headless runner and the
# MCP server: `npx shaderous`, `npx shaderous mcp`), then its listing in the MCP Registry
# (server.json). `node tools/version.mjs X.Y.Z` sets the version in every file first; the tag
# must match all of them. The Claude Code plugin runs the latest npm version, so it follows.
#
# Built here from a clean checkout, so nothing uncommitted reaches the package. No tokens: npm
# trusted publishing (the package's settings name this repository and this file, with
# "Allow npm publish") and the registry's GitHub OIDC login both take this run's identity.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      MCP_PUBLISHER_VERSION: v1.8.9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Versions agree, and match the tag
        run: |
          node tools/version.mjs
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
          fi

      # prepack builds dist/.
      - name: Publish to npm
        run: npm publish --access public --provenance

      # The registry checks the package on npm (its mcpName), so wait until npm serves it.
      - name: Wait for npm to serve this version
        run: |
          v="$(node -p "require('./package.json').version")"
          for i in $(seq 1 30); do
            if [ "$(npm view "shaderous@$v" version 2>/dev/null)" = "$v" ]; then exit 0; fi
            sleep 20
          done
          echo "npm does not serve shaderous@$v after 10 minutes" >&2
          exit 1

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Download and verify mcp-publisher
        run: |
          set -euo pipefail
          archive="mcp-publisher_linux_amd64.tar.gz"
          base_url="https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}"
          curl --fail --location --silent --show-error --output "$archive" "$base_url/$archive"
          curl --fail --location --silent --show-error --output "$archive.sigstore.json" "$base_url/$archive.sigstore.json"
          cosign verify-blob \
            --bundle "$archive.sigstore.json" \
            --certificate-identity "https://github.com/modelcontextprotocol/registry/.github/workflows/release.yml@refs/tags/${MCP_PUBLISHER_VERSION}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "$archive"
          tar xzf "$archive" mcp-publisher
          rm -f "$archive" "$archive.sigstore.json"
      - name: Publish to the MCP Registry
        run: |
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish
