<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Shaderous</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="/src/ui/style.css" />
  </head>
  <body>
    <div id="app">
      <aside id="side"></aside>
      <main id="stage">
        <canvas id="view"></canvas>
        <div id="hud"></div>
        <button id="mem-warn" type="button" hidden></button>
        <div id="rail">
          <button id="rail-toggle" type="button" aria-expanded="true" aria-controls="colorbar tools"></button>
          <div id="colorbar"></div>
          <div id="tools"></div>
        </div>
        <svg id="marks" aria-hidden="true"></svg>
        <svg id="profile-line" aria-hidden="true"></svg>
        <svg id="brush" aria-hidden="true">
          <defs><marker id="brush-head" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" /></marker>
            <radialGradient id="brush-ball" cx="0.36" cy="0.3" r="0.75"><stop offset="0" stop-opacity="0.34" /><stop offset="0.6" stop-opacity="0.08" /><stop offset="1" stop-opacity="0.26" /></radialGradient>
          </defs>
          <circle r="0" /><ellipse /><path class="shape" /><path class="orbit-others" /><path class="orbit off" /><path class="orbit" /><path class="orbit-head" /><line marker-end="url(#brush-head)" />
        </svg>
        <div id="loading" role="status"><span class="spin" aria-hidden="true"></span><span id="loading-text">Loading simulation…</span></div>
        <div id="error"></div>
      </main>
    </div>
    <div id="diag-pop" hidden><div class="title"></div><canvas></canvas></div>
    <div id="cell-pop" hidden><div class="title"></div><div class="body"><dl></dl><div class="eqs" hidden></div></div><div class="pin-actions"><label id="cell-fixed-row" class="fixed" title="Hold the tracer where it is. Unchecked, it moves as the forces on it take it, starting from rest" hidden><input id="cell-fixed" type="checkbox" checked /> Fixed</label><button id="cell-export" type="button" title="Save the readings since the readout was pinned, as CSV" hidden>Export</button><button id="cell-remove" type="button" title="Take this out of the run">Remove</button><button id="cell-unpin" type="button" title="Let the readout go (Esc). A tracer it let go is taken out of the run">Unpin</button></div></div>
    <div id="contour-pop" hidden></div>
    <div id="profile-pop" role="dialog" aria-label="Profile" hidden>
      <div class="head"><span class="title"></span><button id="profile-close" type="button" title="Close the profile, every line (Esc, with no tool in hand)" aria-label="Close">&times;</button></div>
      <div id="profile-fields" class="fields"></div>
      <div class="controls"><button id="profile-add" type="button" title="Plot another field along the same lines (each in a line pattern of its own)">+ Field</button><span class="grow"></span><button id="profile-swap" type="button" title="Swap the line's ends">Swap</button><button id="profile-csv" type="button" title="Save the profile as CSV, in the units shown: a column a field, and every line, numbered, when there are several">CSV</button></div>
      <div id="profile-lines" class="lines" hidden></div>
      <canvas></canvas>
      <div class="foot"></div>
    </div>
    <script type="module" src="/src/ui/app.ts"></script>
  </body>
</html>
