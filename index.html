<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Shaderous</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="/src/ui/style.css" />
  </head>
  <body>
    <div id="app">
      <aside id="side"></aside>
      <main id="stage">
        <canvas id="view"></canvas>
        <div id="hud"></div>
        <div id="rail">
          <div id="colorbar"></div>
          <div id="tools"></div>
        </div>
        <svg id="marks" aria-hidden="true"></svg>
        <svg id="brush" aria-hidden="true">
          <defs><marker id="brush-head" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" /></marker>
            <radialGradient id="brush-ball" cx="0.36" cy="0.3" r="0.75"><stop offset="0" stop-opacity="0.34" /><stop offset="0.6" stop-opacity="0.08" /><stop offset="1" stop-opacity="0.26" /></radialGradient>
          </defs>
          <circle r="0" /><ellipse /><path class="shape" /><line marker-end="url(#brush-head)" />
        </svg>
        <div id="loading" role="status"><span class="spin" aria-hidden="true"></span><span id="loading-text">Loading simulation…</span></div>
        <div id="error"></div>
      </main>
    </div>
    <div id="diag-pop" hidden><div class="title"></div><canvas></canvas></div>
    <script type="module" src="/src/ui/app.ts"></script>
  </body>
</html>
